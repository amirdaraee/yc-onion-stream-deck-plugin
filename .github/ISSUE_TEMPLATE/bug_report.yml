name: Bug report
description: Report a reproducible problem with an existing action or device.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove Bluetooth addresses, serial values, usernames, and unrelated log content before submitting.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 1.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Operating system and Stream Deck versions
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: YC Onion model and advertised Bluetooth name
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the action, its non-sensitive settings, and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      render: text
