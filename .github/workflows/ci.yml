name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-controller:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift protocol
        run: swift test
      - name: Run protocol self-test
        run: swift run yc-onion self-test

  stream-deck-plugin:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - name: Install dependencies
        working-directory: streamdeck
        run: npm ci
      - name: Check plugin
        working-directory: streamdeck
        run: npm run check
      - name: Parse Windows controller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/streamdeck/com.amirdaraee.yc-onion.sdPlugin/controllers/windows/yc-onion.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
